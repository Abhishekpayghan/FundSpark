<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investor Leaderboard — FundSpark</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<style>
  .lb-row{ display:flex; align-items:center; gap:16px; padding:14px 12px; border-radius:12px; }
  .lb-row:nth-child(odd){ background:var(--bg); }
  .lb-rank{ width:32px; text-align:center; font-weight:700; color:var(--text-muted); }
  .lb-rank.top1{ color:#F59E0B; font-size:18px; }
  .lb-rank.top2{ color:#9CA3AF; font-size:16px; }
  .lb-rank.top3{ color:#B87333; font-size:16px; }
  .lb-avatar{ width:40px; height:40px; border-radius:10px; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
  .lb-name{ flex:1; min-width:0; }
  .lb-name b{ font-size:14px; }
  .lb-tier{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .lb-amount{ font-weight:700; font-size:14px; min-width:100px; text-align:right; }

  .my-badge-card{ text-align:center; padding:28px 20px; }
  .my-badge-icon{ width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    margin:0 auto 10px; }
  .progress-thin{ height:6px; border-radius:99px; background:var(--border); overflow:hidden; margin-top:10px; }
  .progress-thin div{ height:100%; border-radius:99px; }
</style>
</head>
<body data-active="leaderboard">
<script>const FS_BASE = "../";</script>
<div class="app-shell">
  <div id="fs-sidebar"></div>
  <div class="main-area">
    <div id="fs-topbar"></div>
    <div class="page-wrap">
      <div class="page-head">
        <div><h1>Investor Leaderboard</h1><p class="text-muted">Top investors by total amount invested on FundSpark.</p></div>
      </div>

      <div class="panel-grid">
        <div class="card my-badge-card" id="myBadgeCard">
          <p class="text-muted" style="margin:0;">Loading your badge...</p>
        </div>
        <div class="card card-pad">
          <h4 style="font-size:15px;margin-top:0;">Badge Tiers</h4>
          <div id="tiersList"></div>
        </div>
      </div>

      <div class="card mt-24">
        <h3 style="margin-top:0;">Top Investors</h3>
        <div id="leaderboardList"></div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/main.js"></script>
<script>
const FS_SESSION = fsInitDashboard('investor'); if(!FS_SESSION) throw new Error('redirecting to login');

function tierIconBg(color){ return `background:${color}22;color:${color};`; }

async function loadMyBadge(){
  const badge = await fsApiGetInvestorBadge(FS_SESSION.userId);
  const card = document.getElementById('myBadgeCard');
  if(!badge){
    card.innerHTML = `<p class="text-muted" style="margin:0;">No investments yet — invest in a startup to earn your first badge.</p>`;
    return;
  }
  const progressPct = badge.nextTierThreshold
    ? Math.min(100, (Number(badge.totalInvested) / Number(badge.nextTierThreshold)) * 100)
    : 100;
  const nextLine = badge.nextTierName
    ? `<span class="text-sm text-muted">₹${(Number(badge.nextTierThreshold) - Number(badge.totalInvested)).toLocaleString('en-IN')} more to reach <b>${badge.nextTierName}</b></span>`
    : `<span class="text-sm text-muted">You've reached the top tier! 🎉</span>`;

  card.innerHTML = `
    <div class="my-badge-icon" style="${tierIconBg(badge.color)}"><i data-lucide="${badge.icon}" style="width:30px;height:30px;"></i></div>
    <h3 style="margin:4px 0;">${badge.tierName} Investor</h3>
    <p class="text-muted" style="margin:0;font-size:13px;">Total invested: <b>₹${Number(badge.totalInvested).toLocaleString('en-IN')}</b></p>
    <div class="progress-thin"><div style="width:${progressPct}%;background:${badge.color};"></div></div>
    <div class="mt-12">${nextLine}</div>
  `;
  if(window.lucide) lucide.createIcons();
}

async function loadTiers(){
  const tiers = await fsApiGetBadgeTiers();
  const el = document.getElementById('tiersList');
  if(!tiers || !tiers.length){ el.innerHTML = `<p class="text-muted">Could not load tiers.</p>`; return; }
  el.innerHTML = tiers.map(t => `
    <div class="flex items-center gap-12 mb-16">
      <div class="lb-avatar" style="${tierIconBg(t.color)}"><i data-lucide="${t.icon}" style="width:18px;height:18px;"></i></div>
      <div style="flex:1;"><b style="font-size:13.5px;">${t.tierName}</b><div class="text-sm text-muted">₹${Number(t.minInvested).toLocaleString('en-IN')}+ invested</div></div>
    </div>`).join('');
  if(window.lucide) lucide.createIcons();
}

async function loadLeaderboard(){
  const rows = await fsApiGetLeaderboard();
  const el = document.getElementById('leaderboardList');
  if(!rows || !rows.length){
    el.innerHTML = `<div class="empty-state"><div class="empty-icon"><i data-lucide="trophy"></i></div><h4>No investors yet</h4><p>Be the first to invest and top the leaderboard.</p></div>`;
    if(window.lucide) lucide.createIcons();
    return;
  }
  el.innerHTML = rows.map((r,i)=>{
    const rank = i+1;
    const rankClass = rank===1?'top1':rank===2?'top2':rank===3?'top3':'';
    const rankIcon = rank<=3 ? `<i data-lucide="${rank===1?'crown':'medal'}" style="width:18px;height:18px;"></i>` : `#${rank}`;
    const initials = (r.investorName||'??').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const isMe = r.investorName === FS_SESSION.fullName;
    return `<div class="lb-row" style="${isMe ? 'outline:2px solid var(--primary);' : ''}">
      <div class="lb-rank ${rankClass}">${rankIcon}</div>
      <div class="lb-avatar">${initials}</div>
      <div class="lb-name"><b>${r.investorName}</b>${isMe ? ' <span class="text-sm" style="color:var(--primary);">(You)</span>' : ''}</div>
      <span class="lb-tier" style="${tierIconBg(r.color)}"><i data-lucide="${r.icon}" style="width:12px;height:12px;"></i> ${r.tierName}</span>
      <div class="lb-amount">₹${Number(r.totalInvested).toLocaleString('en-IN')}</div>
    </div>`;
  }).join('');
  if(window.lucide) lucide.createIcons();
}

window.FS_AFTER_MOUNT = function(){
  if(window.lucide) lucide.createIcons();
  loadMyBadge();
  loadTiers();
  loadLeaderboard();
};
</script>
</body>
</html>
