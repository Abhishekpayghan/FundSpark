<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — FundSpark</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<style>.notif-row{display:flex;gap:14px;padding:16px;border-radius:14px;transition:.18s ease;}
.notif-row:hover{background:var(--gradient-soft);}
.notif-row.unread{background:var(--gradient-soft);}
.notif-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}</style>
</head>
<body data-active="notifications">
<script>const FS_BASE = "../";</script>
<div class="app-shell">
  <div id="fs-sidebar"></div>
  <div class="main-area">
    <div id="fs-topbar"></div>
    <div class="page-wrap">
      <div class="page-head">
        <div><h1>Notifications</h1><p class="text-muted">Stay on top of investments, comments, and campaign milestones.</p></div>
        <button class="btn btn-outline btn-sm" onclick="document.querySelectorAll('.notif-row').forEach(r=>r.classList.remove('unread'));fsToast('All notifications marked as read.','success')">Mark all as read</button>
      </div>
      <div class="card card-pad" id="notifList"></div>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/main.js"></script>
<script>
const FS_SESSION = fsInitDashboard('founder'); if(!FS_SESSION) throw new Error('redirecting to login');
const colorMap = {success:'#22C55E', primary:'#2563EB', secondary:'#7C3AED', warning:'#F59E0B'};

async function loadNotificationsTimeline(){
  const container = document.getElementById('notifList');
  let notifs = [];

  try {
    const list = await fsApiGetNotifications(FS_SESSION.userId);
    if(list && Array.isArray(list) && list.length > 0){
      notifs = list.map(n => ({
        title: n.title || 'Notification',
        text: n.message || n.text || '',
        time: n.createdAt ? new Date(n.createdAt).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : 'Recent',
        icon: n.icon || 'bell',
        color: n.type === 'investment' ? 'success' : 'primary',
        unread: !n.isRead
      }));
    }
  } catch(e) {}

  if(notifs.length === 0){
    // Build real activity timeline from founder's investments & startups
    try {
      const investments = await fsApiGetFounderInvestmentsFeed(FS_SESSION.userId);
      if(investments && Array.isArray(investments)){
        investments.forEach(inv => {
          notifs.push({
            title: `New Investment Received: ₹${Number(inv.amount).toLocaleString()}`,
            text: `${inv.investorName || 'An investor'} backed ${inv.startupName || 'your campaign'}.`,
            time: inv.investedAt ? new Date(inv.investedAt).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : 'Recent',
            icon: 'indian-rupee',
            color: 'success',
            unread: false
          });
        });
      }
      const campaigns = await fsApiGetFounderFeed(FS_SESSION.userId);
      if(campaigns && Array.isArray(campaigns)){
        campaigns.forEach(c => {
          notifs.push({
            title: `Campaign Active: ${c.name}`,
            text: `Your startup campaign is live under category ${c.category || 'Startups'}.`,
            time: 'Active',
            icon: 'rocket',
            color: 'primary',
            unread: false
          });
        });
      }
    } catch(e) {}
  }

  if(notifs.length === 0){
    notifs = FS_NOTIFICATIONS.map(n => ({ ...n, text: n.text || n.message }));
  }

  container.innerHTML = notifs.map(n => `
    <div class="notif-row ${n.unread?'unread':''}">
      <div class="notif-icon" style="background:${colorMap[n.color]||'#2563EB'}22;color:${colorMap[n.color]||'#2563EB'};"><i data-lucide="${n.icon||'bell'}" style="width:18px;height:18px;"></i></div>
      <div style="flex:1;"><b style="font-size:14px;">${n.title}</b><p class="text-sm" style="margin:4px 0;">${n.text}</p><span class="text-sm text-muted">${n.time}</span></div>
    </div>`).join('');

  if(window.lucide) lucide.createIcons();
}

window.FS_AFTER_MOUNT = function(){
  loadNotificationsTimeline();
};
</script>
</body>
</html>
