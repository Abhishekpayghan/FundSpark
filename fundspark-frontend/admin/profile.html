<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — FundSpark Admin</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body data-active="profile">
<script>const FS_BASE = "../";</script>
<div class="app-shell">
  <div id="fs-sidebar"></div>
  <div class="main-area">
    <div id="fs-topbar"></div>
    <div class="page-wrap" style="max-width:820px;">
      <div class="page-head"><div><h1>Profile</h1><p class="text-muted">Your administrator profile and account settings.</p></div></div>

      <div class="card card-pad mb-24">
        <div class="flex items-center gap-24" style="flex-wrap:wrap;">
          <div class="avatar" style="width:84px;height:84px;font-size:28px;border-radius:22px;" id="adminAvatar">AD</div>
          <div style="flex:1;">
            <h3 id="adminName">Admin Name</h3>
            <p class="text-sm" id="adminRole">Administrator</p>
            <div class="flex gap-8 mt-8"><span class="badge badge-success"><i data-lucide="badge-check" style="width:12px;height:12px;"></i> Admin Access</span></div>
          </div>
          <button class="btn btn-outline btn-sm"><i data-lucide="camera"></i> Change Photo</button>
        </div>
      </div>

      <form class="card card-pad" id="adminProfileForm">
        <h4>Personal Information</h4>
        <div class="form-row">
          <div class="form-group"><label>Full Name</label><input id="adminFullName" class="form-control" value=""></div>
          <div class="form-group"><label>Email Address</label><input id="adminEmail" class="form-control" type="email" value=""></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Phone Number</label><input id="adminPhone" class="form-control" value="" placeholder="10-digit mobile number" type="tel" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" title="Enter exactly 10 digits (numbers only)" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)"></div>
          <div class="form-group"><label>Location</label><input id="adminLocation" class="form-control" value=""></div>
        </div>
        <div class="form-group"><label>Bio</label><textarea id="adminBio" class="form-control" rows="3"></textarea></div>
        <button class="btn btn-primary" type="submit"><i data-lucide="save"></i> Save Changes</button>
      </form>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/main.js"></script>
<script>
const FS_SESSION = fsInitDashboard('admin'); if(!FS_SESSION) throw new Error('redirecting to login');

async function loadProfile(){
  let user = FS_SESSION;
  if(user.userId){
    const fresh = await fsApiGetUser(user.userId);
    if(fresh){ user = { ...user, ...fresh }; fsSaveSession(user); }
  }
  const initials = user.avatarInitials || (window.fsInitials ? fsInitials(user.fullName) : 'AD');
  const fullName = user.fullName || 'Administrator';
  const email = user.email || '';
  const phone = (user.phone || '').replace(/\D/g,'').slice(-10);
  const loc = user.location || '';
  const bio = user.bio || 'Platform administrator overseeing users, startups, and approvals.';

  document.getElementById('adminAvatar').textContent = initials;
  document.getElementById('adminName').textContent = fullName;
  document.getElementById('adminRole').textContent = 'Administrator' + (loc ? ` · ${loc}` : '');
  document.getElementById('adminFullName').value = fullName;
  document.getElementById('adminEmail').value = email;
  document.getElementById('adminPhone').value = phone;
  document.getElementById('adminLocation').value = loc;
  document.getElementById('adminBio').value = bio;
}

async function handleProfileSubmit(e){
  e.preventDefault();
    const phoneVal = document.getElementById('adminPhone').value.trim();
  if(phoneVal && !/^[0-9]{10}$/.test(phoneVal)){
    fsToast('Mobile number must be exactly 10 digits (numbers only).','error');
    return;
  }
  const payload = {
    fullName: document.getElementById('adminFullName').value.trim(),
    email: document.getElementById('adminEmail').value.trim(),
    phone: document.getElementById('adminPhone').value.trim(),
    location: document.getElementById('adminLocation').value.trim(),
    bio: document.getElementById('adminBio').value.trim()
  };

  let updated = { ...FS_SESSION, ...payload };
  if(FS_SESSION.userId){
    const res = await fsApiUpdateUser(FS_SESSION.userId, payload);
    if(res && res.userId){ updated = res; }
  }
  fsSaveSession(updated);
  fsToast('Profile updated successfully!','success');
  loadProfile();
}

document.getElementById('adminProfileForm').addEventListener('submit', handleProfileSubmit);
loadProfile();
</script>
</body>
</html>
