<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — FundSpark Admin</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body data-active="reports">
<script>const FS_BASE = "../";</script>
<div class="app-shell">
  <div id="fs-sidebar"></div>
  <div class="main-area">
    <div id="fs-topbar"></div>
    <div class="page-wrap">
      <div class="page-head"><div><h1>Reports</h1><p class="text-muted">Flagged content and user reports awaiting moderation.</p></div></div>

      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Reported Item</th><th>Type</th><th>Reason</th><th>Reported By</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="reportRows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/main.js"></script>
<script>
const FS_SESSION = fsInitDashboard('admin'); if(!FS_SESSION) throw new Error('redirecting to login');

async function loadReports(){
  const reports = await fsApiGetReports();
  const list = reports || [];
  const tbody = document.getElementById('reportRows');
  if(!list.length){
    tbody.innerHTML = `<tr><td colspan="6" class="text-muted" style="text-align:center;padding:22px;">No moderation reports in database. All clear!</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(r => {
    const date = r.date ? new Date(r.date).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '—';
    const statusBadge = r.status === 'dismissed' ? 'badge-secondary' : r.status === 'reviewed' ? 'badge-success' : 'badge-warning';
    return `<tr>
      <td><b>${r.item}</b></td>
      <td><span class="badge badge-secondary">${r.type}</span></td>
      <td>${r.reason}</td>
      <td>${r.reportedBy}</td>
      <td>${date} <span class="badge ${statusBadge}" style="margin-left:6px;">${r.status}</span></td>
      <td><div class="flex gap-8">
        ${r.status === 'pending' ? `
          <button class="btn-icon" title="Dismiss" onclick="dismissReport(${r.id})"><i data-lucide="x" style="width:14px;height:14px;"></i></button>
          <button class="btn-icon" title="Take action" onclick="resolveReport(${r.id})"><i data-lucide="shield-alert" style="width:14px;height:14px;"></i></button>
        ` : '<span class="text-sm text-muted">Resolved</span>'}
      </div></td>
    </tr>`;
  }).join('');
  if(window.lucide) lucide.createIcons();
}

async function dismissReport(id){
  const ok = await fsApiDismissReport(id);
  if(ok){
    fsToast('Report dismissed.', 'info');
    loadReports();
  } else {
    fsToast('Could not dismiss report.', 'error');
  }
}

async function resolveReport(id){
  const ok = await fsApiResolveReport(id);
  if(ok){
    fsToast('Action taken on report.', 'success');
    loadReports();
  } else {
    fsToast('Could not update report.', 'error');
  }
}

window.FS_AFTER_MOUNT = function(){
  if(window.lucide) lucide.createIcons();
  loadReports();
};
</script>
</body>
</html>
