<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — FundSpark</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
<div id="fs-navbar"></div>

<div class="auth-wrap">
  <div class="auth-visual">
    <div style="position:relative;z-index:1;color:#fff;max-width:380px;">
      <div class="mark" style="width:52px;height:52px;background:rgba(255,255,255,.18);margin-bottom:24px;"><i data-lucide="zap"></i></div>
      <h2 style="color:#fff;font-size:30px;">Welcome back to FundSpark</h2>
      <p style="color:rgba(255,255,255,.85);">Track your campaigns, review new investment opportunities, and stay connected with your network.</p>
      <div class="flex items-center gap-12 mt-32">
        <div class="avatar" style="background:#fff;color:var(--primary);">RK</div>
        <div class="avatar" style="background:#fff;color:var(--primary);margin-left:-16px;">AM</div>
        <div class="avatar" style="background:#fff;color:var(--primary);margin-left:-16px;">SK</div>
        <span class="text-sm" style="color:rgba(255,255,255,.85);margin-left:8px;">Joined by 5,000+ founders &amp; investors</span>
      </div>
    </div>
  </div>
  <div class="auth-form-wrap">
    <div class="auth-card">
      <h2>Log in to your account</h2>
      <p class="text-sm mb-24">New to FundSpark? <a href="register.html" style="color:var(--primary);font-weight:600;">Create an account</a></p>

      <div class="pill-nav mb-24" id="roleTabs">
        <span class="pill active" data-role="founder">Founder</span>
        <span class="pill" data-role="investor">Investor</span>
        <span class="pill" data-role="admin">Admin</span>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-icon"><i data-lucide="mail" style="width:17px;height:17px;"></i><input class="form-control" type="email" required placeholder="you@example.com" value="demo@fundspark.io"></div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-icon"><i data-lucide="lock" style="width:17px;height:17px;"></i><input class="form-control" type="password" required placeholder="••••••••" value="demo1234"></div>
        </div>
        <div class="flex justify-between items-center mb-24">
          <label class="checkbox-row"><input type="checkbox" checked> Remember me</label>
          <a href="forgot-password.html" class="text-sm" style="color:var(--primary);font-weight:600;">Forgot password?</a>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log In</button>
      </form>
      <div class="flex items-center gap-12 mt-24" style="color:var(--text-muted);">
        <hr style="flex:1;border:none;border-top:1px solid var(--border);"><span class="text-sm">or continue with</span><hr style="flex:1;border:none;border-top:1px solid var(--border);">
      </div>
      <div class="flex gap-12 mt-16">
        <button type="button" class="btn btn-outline btn-block" onclick="fsToast('Google sign-in simulated for this prototype.','info')"><i data-lucide="chrome"></i> Google</button>
        <button type="button" class="btn btn-outline btn-block" onclick="fsToast('LinkedIn sign-in simulated for this prototype.','info')"><i data-lucide="linkedin"></i> LinkedIn</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/main.js"></script>
<script>
let selectedRole = 'founder';
document.getElementById('roleTabs').addEventListener('click', e=>{
  const p = e.target.closest('.pill'); if(!p) return;
  document.querySelectorAll('#roleTabs .pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); selectedRole = p.getAttribute('data-role');
});
function handleLogin(e){
  e.preventDefault();
  fsToast('Login successful. Redirecting to your dashboard...','success');
  setTimeout(()=>{ location.href = selectedRole + '/dashboard.html'; }, 900);
}
</script>
</body>
</html>
