<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — FundSpark</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body data-active="profile">
<script>const FS_BASE = "../";</script>
<div class="app-shell">
  <div id="fs-sidebar"></div>
  <div class="main-area">
    <div id="fs-topbar"></div>
    <div class="page-wrap" style="max-width:820px;">
      <div class="page-head"><div><h1>Profile</h1><p class="text-muted">This is how founders appear to investors.</p></div></div>

      <div class="card card-pad mb-24">
        <div class="flex items-center gap-24" style="flex-wrap:wrap;">
          <div class="avatar" style="width:84px;height:84px;font-size:28px;border-radius:22px;">RK</div>
          <div style="flex:1;">
            <h3 style="margin-bottom:2px;">Riya Kulkarni</h3>
            <p class="text-sm" style="margin:0;">Founder &amp; CEO, AgroSense · Pune, Maharashtra</p>
            <div class="flex gap-8 mt-8"><span class="badge badge-success"><i data-lucide="badge-check" style="width:12px;height:12px;"></i> Verified Founder</span><span class="badge badge-primary">3 campaigns</span></div>
          </div>
          <button class="btn btn-outline btn-sm"><i data-lucide="camera"></i> Change Photo</button>
        </div>
      </div>

      <form class="card card-pad" onsubmit="event.preventDefault(); fsToast('Profile updated successfully.','success');">
        <h4>Personal Information</h4>
        <div class="form-row">
          <div class="form-group"><label>Full Name</label><input class="form-control" value="Riya Kulkarni"></div>
          <div class="form-group"><label>Email Address</label><input class="form-control" type="email" value="riya.kulkarni@fundspark.io"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Phone Number</label><input class="form-control" value="+91 98765 43210"></div>
          <div class="form-group"><label>Location</label><input class="form-control" value="Pune, Maharashtra"></div>
        </div>
        <div class="form-group"><label>Bio</label><textarea class="form-control" rows="3">Agri-tech founder building affordable IoT tools for small and marginal farmers across Maharashtra.</textarea></div>
        <div class="form-row">
          <div class="form-group"><label>LinkedIn</label><input class="form-control" placeholder="https://linkedin.com/in/..."></div>
          <div class="form-group"><label>Website</label><input class="form-control" placeholder="https://"></div>
        </div>
        <button class="btn btn-primary" type="submit"><i data-lucide="save"></i> Save Changes</button>
      </form>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/main.js"></script>
<script>FS_MOUNT.dashboard('founder','Riya Kulkarni','RK');</script>
</body>
</html>
