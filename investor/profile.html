<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — FundSpark</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body data-active="profile">
<script>const FS_BASE = "../";</script>
<div class="app-shell">
  <div id="fs-sidebar"></div>
  <div class="main-area">
    <div id="fs-topbar"></div>
    <div class="page-wrap" style="max-width:820px;">
      <div class="page-head"><div><h1>Profile</h1><p class="text-muted">This is how founders see you when you show interest.</p></div></div>

      <div class="card card-pad mb-24">
        <div class="flex items-center gap-24" style="flex-wrap:wrap;">
          <div class="avatar" style="width:84px;height:84px;font-size:28px;border-radius:22px;">AM</div>
          <div style="flex:1;">
            <h3 style="margin-bottom:2px;">Arjun Malhotra</h3>
            <p class="text-sm" style="margin:0;">Angel Investor · Mumbai, Maharashtra</p>
            <div class="flex gap-8 mt-8"><span class="badge badge-success"><i data-lucide="badge-check" style="width:12px;height:12px;"></i> Verified Investor</span><span class="badge badge-primary">12 investments</span></div>
          </div>
          <button class="btn btn-outline btn-sm"><i data-lucide="camera"></i> Change Photo</button>
        </div>
      </div>

      <form class="card card-pad" onsubmit="event.preventDefault(); fsToast('Profile updated successfully.','success');">
        <h4>Personal Information</h4>
        <div class="form-row">
          <div class="form-group"><label>Full Name</label><input class="form-control" value="Arjun Malhotra"></div>
          <div class="form-group"><label>Email Address</label><input class="form-control" type="email" value="arjun.m@fundspark.io"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Phone Number</label><input class="form-control" value="+91 91234 56780"></div>
          <div class="form-group"><label>Location</label><input class="form-control" value="Mumbai, Maharashtra"></div>
        </div>
        <div class="form-group"><label>Investment Interests</label>
          <div class="pill-nav">
            <span class="pill active">FinTech</span><span class="pill active">Healthcare</span><span class="pill">SaaS</span><span class="pill">Agriculture</span><span class="pill">Robotics</span>
          </div>
        </div>
        <div class="form-group"><label>Typical Ticket Size (₹)</label><input class="form-control" value="1,00,000 – 5,00,000"></div>
        <button class="btn btn-primary" type="submit"><i data-lucide="save"></i> Save Changes</button>
      </form>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/main.js"></script>
<script>
FS_MOUNT.dashboard('investor','Arjun Malhotra','AM');
document.querySelectorAll('.pill-nav .pill').forEach(p=>p.addEventListener('click',()=>p.classList.toggle('active')));
</script>
</body>
</html>
