spring.application.name=fundspark_backend

# ── Database (MySQL / Aiven Cloud) ──────────────────────
# Configured via environment variables (Render Dashboard or local .env)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fundspark}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── File uploads ─────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ── Email / OTP reset ─────────────────────────────────────
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST:smtp.gmail.com}

app.password-reset.otp-expiry-minutes=5
app.password-reset.token-expiry-minutes=10
app.password-reset.max-attempts=5
app.password-reset.resend-cooldown-seconds=60
app.password-reset.email-from=${SMTP_USERNAME:no-reply@fundspark.local}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS=CORS_ALLOWED_ORIGINS=https://fundspark-fundspark-frontend.vercel.app,https://fundspark-fundspark-frontend-oy7jq3l3y-agpmaster123-1823.vercel.app}

# ── Server port (Render sets $PORT automatically) ────────
server.port=${PORT:8080}
