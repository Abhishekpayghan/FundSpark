spring.application.name=fundspark_backend

# ── Database (MySQL / Aiven Cloud) ──────────────────────
# Configured via environment variables (Render Dashboard or local .env)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fundspark}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── File uploads ─────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ── Server port (Render sets $PORT automatically) ────────
server.port=${PORT:8080}
